name: Deploy to GCP

# Manual-only. This builds the original Cloud Run tunnel-gateway/control-plane
# images, which are NOT the current preview path — previews now run on a single
# frps + Caddy VM (see infra/gateway/). It also needs GCP_SA_KEY / GCP_PROJECT_ID
# secrets that are not configured, so a push trigger only produces red builds.
# Kept here (dispatch-only) until the gateway-v2 services are rebuilt; re-enable
# the push trigger then.
on:
  workflow_dispatch:

env:
  REGION: us-central1

jobs:
  build-tunnel-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - id: project
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push tunnel-gateway
        working-directory: services/tunnel-gateway
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pugloo/tunnel-gateway:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pugloo/tunnel-gateway:${{ github.sha }}

  build-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - id: project
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push control-plane
        working-directory: services/control-plane
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pugloo/control-plane:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/pugloo/control-plane:${{ github.sha }}
